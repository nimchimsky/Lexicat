services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pompeu
      POSTGRES_PASSWORD: pompeu
      POSTGRES_DB: pompeu
    ports:
      - "5433:5432"
    volumes:
      - pompeu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pompeu -d pompeu"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pompeu_pgdata:
